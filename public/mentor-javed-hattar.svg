<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Soft Drop Shadow for Sofa & Figure -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#021B4E" flood-opacity="0.18" />
    </filter>
    
    <!-- Laptop Glow -->
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Shirt Denim Gradient -->
    <linearGradient id="denimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Sofa Gray Gradient -->
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Background Soft Radial Light -->
  <circle cx="400" cy="400" r="380" fill="#F8FAFC" />

  <!-- 1. Sofa Back & Armrests (Dark Charcoal Gray) -->
  <g filter="url(#softShadow)">
    <!-- Sofa Back Cushion -->
    <rect x="60" y="460" width="680" height="280" rx="40" fill="url(#sofaGrad)" />
    <!-- Left Armrest -->
    <rect x="40" y="500" width="120" height="240" rx="30" fill="#334155" />
    <!-- Right Armrest -->
    <rect x="640" y="500" width="120" height="240" rx="30" fill="#334155" />
    <!-- Main Seat Cushion -->
    <rect x="120" y="560" width="560" height="190" rx="24" fill="#1E293B" />
  </g>

  <!-- 2. Figure: Javed Hattar -->
  <g filter="url(#softShadow)">
    
    <!-- Legs in Light Blue Jeans (Crossed position) -->
    <path d="M 280 540 L 220 720 L 360 740 L 450 630 Z" fill="#93C5FD" />
    <path d="M 450 630 L 320 740 L 580 720 L 520 540 Z" fill="#60A5FA" />

    <!-- White Shoes/Sneakers -->
    <ellipse cx="210" cy="735" rx="35" ry="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <ellipse cx="590" cy="735" rx="35" ry="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />

    <!-- Torso: White Inner T-Shirt -->
    <path d="M 340 380 Q 400 370 460 380 L 480 580 L 320 580 Z" fill="#FFFFFF" />

    <!-- Torso: Light Blue Denim Shirt (Open Button-Down) -->
    <!-- Left Side Shirt -->
    <path d="M 300 360 C 310 320 340 380 340 380 L 310 590 C 250 560 210 500 200 420 C 200 380 250 360 300 360 Z" fill="url(#denimGrad)" />
    <!-- Left Sleeve -->
    <path d="M 200 420 C 180 460 160 520 220 560 L 300 540 Z" fill="#60A5FA" />

    <!-- Right Side Shirt -->
    <path d="M 500 360 C 490 320 460 380 460 380 L 490 590 C 550 560 590 500 600 420 C 600 380 550 360 500 360 Z" fill="url(#denimGrad)" />
    <!-- Right Sleeve -->
    <path d="M 600 420 C 620 460 640 520 580 560 L 500 540 Z" fill="#60A5FA" />

    <!-- Hands resting on Laptop Side -->
    <ellipse cx="310" cy="545" rx="22" ry="16" fill="#D97706" opacity="0.8" />
    <ellipse cx="490" cy="545" rx="22" ry="16" fill="#D97706" opacity="0.8" />

    <!-- Silver Laptop Lid on Lap -->
    <g transform="translate(400, 560)">
      <!-- Laptop Screen Lid -->
      <path d="M -160,-60 L 160,-60 L 140,50 L -140,50 Z" fill="url(#laptopGrad)" stroke="#64748B" stroke-width="4" />
      <path d="M -160,-60 L 160,-60 L 160,-55 L -160,-55 Z" fill="#94A3B8" />

      <!-- Official Future Gates Seal Logo on Laptop Back Lid -->
      <g transform="translate(0, -5)">
        <!-- Outer Scalloped Dark Blue Badge -->
        <circle cx="0" cy="0" r="42" fill="#021B4E" />
        <circle cx="0" cy="0" r="38" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
        
        <!-- Outer Ring Text (Micro Scale for laptop seal) -->
        <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="5" text-anchor="middle" y="-28">FUTURE GATES i.T CENTER</text>
        <text fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="4" text-anchor="middle" y="32">Where Skills Become Your Income</text>

        <!-- Inner White Circle -->
        <circle cx="0" cy="0" r="24" fill="#FFFFFF" />
        
        <!-- Mini Laptop & Handshake Icon in Seal -->
        <rect x="-14" y="-10" width="28" height="18" rx="2" fill="none" stroke="#021B4E" stroke-width="2" />
        <line x1="-18" y1="10" x2="18" y2="10" stroke="#021B4E" stroke-width="2" stroke-linecap="round" />

        <!-- Mini Circuit Handshake (Orange & Blue) -->
        <circle cx="-5" cy="0" r="2" fill="#E85A00" />
        <circle cx="5" cy="0" r="2" fill="#021B4E" />
        <path d="M -8,0 L -2,0 M 2,0 L 8,0" stroke="#E85A00" stroke-width="1.5" />
      </g>
    </g>

    <!-- Neck & Skin Tones -->
    <path d="M 365 300 Q 400 320 435 300 L 440 370 Q 400 395 360 370 Z" fill="#D97706" opacity="0.85" />

    <!-- Head & Face: Javed Hattar -->
    <g transform="translate(400, 220)">
      <!-- Head Base Oval -->
      <ellipse cx="0" cy="0" rx="72" ry="92" fill="#E59866" />
      
      <!-- Ears -->
      <ellipse cx="-72" cy="0" rx="12" ry="20" fill="#D97706" />
      <ellipse cx="72" cy="0" rx="12" ry="20" fill="#D97706" />

      <!-- Full Groomed Beard & Mustache (Dark Charcoal / Black) -->
      <path d="M -72,-10 C -72,70 -50,105 0,105 C 50,105 72,70 72,-10 C 65,30 45,60 0,60 C -45,60 -65,30 -72,-10 Z" fill="#1E1E24" />
      <!-- Mustache -->
      <path d="M -35,22 C -20,15 0,25 0,25 C 0,25 20,15 35,22 C 25,36 0,38 0,38 C 0,38 -25,36 -35,22 Z" fill="#1E1E24" />

      <!-- Mouth & Lips -->
      <path d="M -15,32 Q 0,38 15,32" fill="none" stroke="#A04000" stroke-width="2.5" stroke-linecap="round" />

      <!-- Nose -->
      <path d="M 0,-15 L 6,10 L -4,15" fill="none" stroke="#B95C00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Eyes & Eyebrows -->
      <!-- Eyebrows -->
      <path d="M -48,-32 Q -28,-42 -8,-32" fill="none" stroke="#1E1E24" stroke-width="6" stroke-linecap="round" />
      <path d="M 8,-32 Q 28,-42 48,-32" fill="none" stroke="#1E1E24" stroke-width="6" stroke-linecap="round" />

      <!-- Eyes -->
      <ellipse cx="-28" cy="-20" rx="10" ry="7" fill="#FFFFFF" />
      <circle cx="-28" cy="-20" r="4" fill="#1E1E24" />
      <ellipse cx="28" cy="-20" rx="10" ry="7" fill="#FFFFFF" />
      <circle cx="28" cy="-20" r="4" fill="#1E1E24" />

      <!-- Stylish Black-Framed Glasses -->
      <rect x="-52" y="-34" width="46" height="32" rx="10" fill="none" stroke="#0F172A" stroke-width="5" />
      <rect x="6" y="-34" width="46" height="32" rx="10" fill="none" stroke="#0F172A" stroke-width="5" />
      <!-- Glasses Bridge -->
      <line x1="-6" y1="-22" x2="6" y2="-22" stroke="#0F172A" stroke-width="5" />
      <!-- Glasses Side Temples -->
      <line x1="-52" y1="-22" x2="-70" y2="-22" stroke="#0F172A" stroke-width="4" />
      <line x1="52" y1="-22" x2="70" y2="-22" stroke="#0F172A" stroke-width="4" />

      <!-- Hair: Stylish Neat Black Hair -->
      <path d="M -72,-20 C -75,-80 -40,-115 0,-115 C 40,-115 75,-80 72,-20 C 60,-65 30,-90 0,-90 C -30,-90 -60,-65 -72,-20 Z" fill="#1E1E24" />
      <!-- Hair Volume Lock top -->
      <path d="M -50,-85 C -20,-110 20,-110 50,-85 C 30,-98 -10,-98 -50,-85 Z" fill="#2D2D38" />
    </g>
  </g>
</svg>
